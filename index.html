<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Larissa App - Cilacap</title>
  <meta name="theme-color" content="#009D7B">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon & Icon -->
  <link rel="icon" type="image/jpeg" href="https://lh3.googleusercontent.com/pw/AP1GczPsClAMuZr8jGobp1T63vXCnzOJ0AE7Yoru4irAj7HUbAaxZkTpR_JRJZtNFNLeIGu0hCr-ma89kntUmQZAr_li0P8kJ-id_w79D9XsHe4FnWLgFP5Ihld-ww2arEbYvDMQKbNRdeoJWArbDYGUIJ13=w933-h945-s-no-gm?authuser=0">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/pw/AP1GczPsClAMuZr8jGobp1T63vXCnzOJ0AE7Yoru4irAj7HUbAaxZkTpR_JRJZtNFNLeIGu0hCr-ma89kntUmQZAr_li0P8kJ-id_w79D9XsHe4FnWLgFP5Ihld-ww2arEbYvDMQKbNRdeoJWArbDYGUIJ13=w933-h945-s-no-gm?authuser=0">

  <!-- Manifest PWA Khusus Desktop -->
  <script>
    const manifestPWA = {
      "name": "Larissa App",
      "short_name": "Cilacap",
      "description": "Solusi membantu mengelola data laporan dengan lebih efisien dan modern.",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#0f172a",
      "theme_color": "#ffffff",
      "orientation": "any",
      "icons": [
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczPsClAMuZr8jGobp1T63vXCnzOJ0AE7Yoru4irAj7HUbAaxZkTpR_JRJZtNFNLeIGu0hCr-ma89kntUmQZAr_li0P8kJ-id_w79D9XsHe4FnWLgFP5Ihld-ww2arEbYvDMQKbNRdeoJWArbDYGUIJ13=w933-h945-s-no-gm?authuser=0",
          "sizes": "192x192",
          "type": "image/jpeg"
        },
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczPsClAMuZr8jGobp1T63vXCnzOJ0AE7Yoru4irAj7HUbAaxZkTpR_JRJZtNFNLeIGu0hCr-ma89kntUmQZAr_li0P8kJ-id_w79D9XsHe4FnWLgFP5Ihld-ww2arEbYvDMQKbNRdeoJWArbDYGUIJ13=w933-h945-s-no-gm?authuser=0",
          "sizes": "512x512",
          "type": "image/jpeg"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestPWA)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh;
      overflow: hidden; 
      background-color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Container Iframe Utama Desktop */
    .desktop-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
      background-color: #ffffff;
    }

    /* Splash Screen Desktop */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(0, 157, 123, 0.85)), 
                  url('https://images.unsplash.com/photo-1785138859928-e87e911afb2c?q=80') center/cover no-repeat;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
    }

    /* Custom Scrollbar Desktop */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #009D7B;
      border-radius: 4px;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- DESKTOP SPLASH SCREEN -->
  <div id="loading-screen"></div>

  <!-- CONTAINER UTAMA IFRAME DESKTOP -->
  <div class="desktop-container">
    <iframe 
      id="app-frame" 
      src="https://script.google.com/macros/s/AKfycbxI2OyyQq8MjRd4iyPSPoS-l7uEOerizxGHN4m22q2Jfo-kaxYn4KmxeAMmr0w6h3g1/exec"
      allow="autoplay; camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen">
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById('app-frame');
    const loadingScreen = document.getElementById('loading-screen');

    // 1. Sembunyikan Splash Screen setelah Iframe selesai dimuat
    iframe.addEventListener('load', function() {
      setTimeout(() => {
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.visibility = 'hidden';
        }, 500); 
      }, 400);
    });
    
    // 2. Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blobSW = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blobSW));
      });
    }
  </script>
</body>
</html>
